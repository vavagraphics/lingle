<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Breaker Buddy</title>
<style>
  :root { --bg: #ffffff; --ink: #14171a; --muted: #6b7078; --pill: #05090c; --on-pill: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121417; --ink: #f3f5f7; --muted: #9aa0a7; --pill: #f3f5f7; --on-pill: #05090c; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 56px 24px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; text-align: center; background: var(--pill); color: var(--on-pill); text-decoration: none; font-weight: 700; padding: 18px; border-radius: 999px; margin-bottom: 12px; }
  a.alt { display: block; text-align: center; color: var(--ink); font-weight: 600; padding: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening your panel map</h1>
  <p id="sub">This sticker opens the panel in the Breaker Buddy app on Android.</p>
  <a class="btn" id="open" href="#">Open in Breaker Buddy</a>
  <a class="alt" href="https://play.google.com/store/apps/details?id=com.vavagraphics.breakerbuddy">Get Breaker Buddy on Google Play</a>
</main>
<script>
  // Hands the panel number from the sticker to the app. Nothing is stored or sent anywhere.
  var q = new URLSearchParams(location.search);
  var panel = (q.get("panel") || "").replace(/[^0-9]/g, "");
  var name = (q.get("n") || "").slice(0, 40);
  var play = "https://play.google.com/store/apps/details?id=com.vavagraphics.breakerbuddy";
  if (name) document.getElementById("title").textContent = "Opening " + name;
  var app = "breakerbuddy://open?panel=" + panel + "&n=" + encodeURIComponent(name);
  var intent = "intent://open?panel=" + panel + "&n=" + encodeURIComponent(name) +
    "#Intent;scheme=breakerbuddy;package=com.vavagraphics.breakerbuddy;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
  var isAndroid = /Android/i.test(navigator.userAgent);
  document.getElementById("open").href = isAndroid ? intent : app;
  if (isAndroid && panel) location.replace(intent);
  if (!isAndroid) document.getElementById("sub").textContent = "Breaker Buddy is an Android app. Open this on the Android phone that has your panel map.";
</script>
</body>
</html>
